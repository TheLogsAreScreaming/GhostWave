; GhostWave node firmware for ESP32-S3 and nRF52840 LoRa boards (Arduino +
; RadioLib). The portable core (../core) and Monocypher (../third_party) are
; built in place as local libraries via lib/*/library.json, so nothing is copied.
;
;   pio run                                       build every env
;   pio run -e heltec_wireless_tracker_v2 -t upload   flash one board
;   pio run -e rak4631                            .pio/build/rak4631/firmware.uf2
;   pio device monitor                            115200 baud CLI

[platformio]
default_envs = heltec_wireless_tracker_v2, heltec_v3, rak4631
boards_dir = boards

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
lib_deps =
  jgromes/RadioLib@7.8.1
  ghostwave_core
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -DRADIOLIB_EXCLUDE_LORAWAN=1

[env:heltec_wireless_tracker_v2]
; platform-espressif32 has no Tracker V2 board, so this is the generic
; ESP32-S3 module set up like Meshtastic's boards/heltec_wireless_tracker_v2.json:
; 8 MB QIO flash, native USB CDC as the serial console.
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
build_flags =
  ${env.build_flags}
  -DGW_BOARD_TRACKER_V2=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:heltec_v3]
board = heltec_wifi_lora_32_V3
board_build.partitions = default_8MB.csv
build_flags =
  ${env.build_flags}
  -DGW_BOARD_HELTEC_V3=1

[env:rak4631]
; RAK4631 WisBlock core on a RAK19007/19003 base board: nRF52840 + SX1262,
; Adafruit nRF52 Arduino core with the S140 6.1.1 SoftDevice and the UF2
; bootloader RAK ships. Board JSON and pin variant are ours (boards/,
; variants/rak4631), sources cited in variant.h. Output: firmware.uf2.
platform = nordicnrf52@10.6.0
platform_packages =
  platformio/framework-arduinoadafruitnrf52@1.10700.0
  platformio/toolchain-gccarmnoneeabi@1.70201.0
board = rak4631
board_build.variants_dir = variants
extra_scripts = post:scripts/uf2.py
lib_deps =
  ${env.lib_deps}
build_flags =
  ${env.build_flags}
  -DGW_BOARD_RAK4631=1
  -DCFG_DEBUG=0
  -DRADIOLIB_EXCLUDE_SX127X=1
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1
