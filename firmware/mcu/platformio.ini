; GhostWave node firmware for ESP32-S3 and nRF52840 LoRa boards (Arduino +
; RadioLib). The portable core (../core) and Monocypher (../third_party) are
; built in place as local libraries via lib/*/library.json, so nothing is copied.
;
;   pio run                                       build every env
;   pio run -e heltec_wireless_tracker_v2 -t upload   flash one board
;   pio run -e rak4631                            .pio/build/rak4631/firmware.uf2
;   pio run -e t1000e                             .pio/build/t1000e/firmware.uf2
;   pio device monitor                            115200 baud CLI

[platformio]
extra_configs = boards.d/*.ini
default_envs = heltec_wireless_tracker_v2, heltec_v3, rak4631, t1000e
boards_dir = boards

[env]
extra_scripts = post:scripts/flash_layout.py
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
lib_deps =
  jgromes/RadioLib@7.8.1
  ghostwave_core
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -DRADIOLIB_EXCLUDE_LORAWAN=1

[env:heltec_wireless_tracker_v2]
; platform-espressif32 has no Tracker V2 board, so this is the generic
; ESP32-S3 module set up like Meshtastic's boards/heltec_wireless_tracker_v2.json:
; 8 MB QIO flash, native USB CDC as the serial console.
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
build_flags =
  ${env.build_flags}
  -DGW_BOARD_TRACKER_V2=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:heltec_v3]
board = heltec_wifi_lora_32_V3
board_build.partitions = default_8MB.csv
build_flags =
  ${env.build_flags}
  -DGW_BOARD_HELTEC_V3=1

[env:heltec_wsl_v3]
; Heltec Wireless Stick Lite V3: the same LoRa pins, TCXO and Vext as heltec_v3
; (meshtastic/firmware @ 771efca, variants/esp32s3/heltec_wsl_v3).
extends = env:heltec_v3
build_flags =
  ${env:heltec_v3.build_flags}
  -DGW_BOARD_NAME=\"heltec_wsl_v3\"

[env:rak4631]
; RAK4631 WisBlock core on a RAK19007/19003 base board: nRF52840 + SX1262,
; Adafruit nRF52 Arduino core with the S140 6.1.1 SoftDevice and the UF2
; bootloader RAK ships. Board JSON and pin variant are ours (boards/,
; variants/rak4631), sources cited in variant.h. Output: firmware.uf2.
platform = nordicnrf52@10.6.0
platform_packages =
  platformio/framework-arduinoadafruitnrf52@1.10700.0
  platformio/toolchain-gccarmnoneeabi@1.70201.0
board = rak4631
board_build.variants_dir = variants
extra_scripts = post:scripts/uf2.py
lib_deps =
  ${env.lib_deps}
build_flags =
  ${env.build_flags}
  -DGW_BOARD_RAK4631=1
  -DCFG_DEBUG=0
  -DRADIOLIB_EXCLUDE_SX127X=1
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1

[env:rak_wismesh_tag]
; RAK WisMesh Tag: a RAK4630 in a sealed tag, so the same radio pins, variant
; and bootloader as rak4631 (meshtastic/firmware @ 771efca,
; variants/nrf52840/rak_wismeshtag). Its GPS, button and buzzer are not used yet.
extends = env:rak4631
build_flags =
  ${env:rak4631.build_flags}
  -DGW_BOARD_NAME=\"rak_wismesh_tag\"

[env:rak3401_1w]
; RAK3401 + RAK13302 1 W module (nRF52840, SX1262, SKY66122 PA). Same bootloader
; layout and pin variant as the RAK4631, but the radio is on SPI1.
platform = nordicnrf52@10.6.0
platform_packages =
  platformio/framework-arduinoadafruitnrf52@1.10700.0
  platformio/toolchain-gccarmnoneeabi@1.70201.0
board = rak4631
board_build.variants_dir = variants
extra_scripts = post:scripts/uf2.py
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit SSD1306@2.5.13
  adafruit/Adafruit GFX Library@1.12.1
  adafruit/Adafruit BusIO@1.17.2
build_flags =
  ${env.build_flags}
  -DGW_BOARD_RAK3401_1W=1
  -DCONFIG_NFCT_PINS_AS_GPIOS=1
  -DCFG_DEBUG=0
  -DRADIOLIB_EXCLUDE_SX127X=1
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1

[env:t1000e]
; Seeed SenseCAP T1000-E: nRF52840 + LR1110 + AG3335 GNSS, button, buzzer,
; LED, battery. Same core and pins policy as rak4631, but Seeed's bootloader
; carries the S140 7.3.0 SoftDevice, so the app starts at 0x27000 (our linker
; script, variants/t1000e/nrf52840_s140_v7.ld). Output: firmware.uf2.
platform = nordicnrf52@10.6.0
platform_packages =
  platformio/framework-arduinoadafruitnrf52@1.10700.0
  platformio/toolchain-gccarmnoneeabi@1.70201.0
board = t1000e
board_build.variants_dir = variants
board_build.ldscript = variants/t1000e/nrf52840_s140_v7.ld
extra_scripts = post:scripts/uf2.py
lib_deps =
  ${env.lib_deps}
build_flags =
  ${env.build_flags}
  -DGW_BOARD_T1000E=1
  -DCFG_DEBUG=0
  -DRADIOLIB_EXCLUDE_SX127X=1
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_SX126X=1
