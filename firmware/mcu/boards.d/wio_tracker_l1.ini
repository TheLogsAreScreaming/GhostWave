[env:wio_tracker_l1]
; Seeed Wio Tracker L1, with its SSD1306 OLED and GPS. Untested on hardware.
platform = nordicnrf52@10.6.0
platform_packages =
  platformio/framework-arduinoadafruitnrf52@1.10700.0
  platformio/toolchain-gccarmnoneeabi@1.70201.0
board = t1000e
board_build.variant = gw_nrf52840
board_build.variants_dir = variants
board_build.ldscript = variants/t1000e/nrf52840_s140_v7.ld
extra_scripts = post:scripts/uf2.py
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit SSD1306@2.5.13
  adafruit/Adafruit GFX Library@1.12.1
  adafruit/Adafruit BusIO@1.17.2
build_flags =
  ${env.build_flags}
  -DGW_BOARD_FILE=\"boards/wio_tracker_l1.h\"
  -DCFG_DEBUG=0
  -DRADIOLIB_EXCLUDE_SX127X=1
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1
  -DPIN_SPI_SCK=30
  -DPIN_SPI_MISO=3
  -DPIN_SPI_MOSI=28
