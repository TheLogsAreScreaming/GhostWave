[env:t_echo]
; LilyGO T-Echo, with its e-ink screen. Untested on hardware.
platform = nordicnrf52@10.6.0
platform_packages =
  platformio/framework-arduinoadafruitnrf52@1.10700.0
  platformio/toolchain-gccarmnoneeabi@1.70201.0
board = rak4631
board_build.variant = gw_nrf52840
board_build.variants_dir = variants
extra_scripts = post:scripts/uf2.py
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit GFX Library@1.12.1
  adafruit/Adafruit BusIO@1.17.2
build_flags =
  ${env.build_flags}
  -DGW_BOARD_FILE=\"boards/t_echo.h\"
  -DCFG_DEBUG=0
  -DRADIOLIB_EXCLUDE_SX127X=1
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1
  -DPIN_SPI_SCK=19
  -DPIN_SPI_MISO=23
  -DPIN_SPI_MOSI=22
