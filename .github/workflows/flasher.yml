name: Web flasher
on:
  push:
    branches: [main]
    paths: ['flasher/**', 'scripts/publish-board-release.py', '.github/workflows/flasher.yml']
  pull_request:
    paths: ['flasher/**', 'scripts/publish-board-release.py', '.github/workflows/flasher.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
      - run: node --test flasher/tests/*.test.mjs
      - run: python3 -m unittest discover -s flasher/tests -p 'test_*.py'
