name: Board package regression tests
on:
  pull_request:
    paths: ['scripts/package-board-firmware.py', 'scripts/test-board-packages.py', '.github/workflows/board-package-tests.yml']
  push:
    branches: [main]
    paths: ['scripts/package-board-firmware.py', 'scripts/test-board-packages.py', '.github/workflows/board-package-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - run: python3 scripts/test-board-packages.py
