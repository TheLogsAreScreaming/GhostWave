name: App

# The Flutter phone app in app/. It talks to the node over the client link
# defined by proto/ghostwave.proto, so proto changes run it too.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'proto/**'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'proto/**'
      - '.github/workflows/app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: App format, analyze, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib/main.dart lib/src/app lib/src/link lib/src/ui test
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Generated protobuf code matches proto/ghostwave.proto
        run: |
          sudo apt-get install -y -qq protobuf-compiler >/dev/null
          dart pub global activate protoc_plugin 25.1.0 >/dev/null
          ./tool/gen_proto.sh
          git diff --exit-code -- lib/src/gen
          test -z "$(git status --porcelain -- lib/src/gen)"
      - name: Unit and widget tests
        run: flutter test --test-randomize-ordering-seed random

  integration:
    name: App integration (ghostwaved from this tree, virtual mesh)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Build ghostwaved
        working-directory: firmware
        run: |
          cmake -S . -B build -DGHOSTWAVE_BUILD_VIRT=ON >/dev/null
          cmake --build build --target ghostwaved --parallel
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Two app clients DM over the virtual mesh
        run: |
          export GHOSTWAVED=$GITHUB_WORKSPACE/firmware/build/ghostwaved
          export GW_MCAST_PORT=$(( 48000 + GITHUB_RUN_ID % 10000 ))
          flutter test test/integration --reporter expanded

  android:
    name: App Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # arm64 only: every current Android phone, about a third of a universal APK
      - name: Build APK (release mode, arm64, signed with the CI debug key)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --build-number ${{ github.run_number }}
      - name: Name the APK
        run: |
          short=$(git rev-parse --short HEAD)
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "out/ghostwave-app-${{ github.run_number }}-$short-arm64.apk"
          {
            echo "### APK built"
            echo '```'
            ls -l out/*.apk
            sha256sum out/*.apk
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: ghostwave-app-apk
          path: app/out/*.apk
          retention-days: 14
          if-no-files-found: error

  ios:
    name: App iOS build (no codesign)
    # macOS runners: only for PRs, main and manual runs (the path filter above
    # already limits pushes to main)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: flutter build ios --no-codesign
        run: flutter build ios --no-codesign --build-number ${{ github.run_number }}
